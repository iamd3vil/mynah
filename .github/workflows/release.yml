name: release

# Push a tag like v0.2.0 to build and publish a release. Run manually
# (workflow_dispatch) to check the build without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake pkg-config libasound2-dev libxkbcommon-dev libvulkan-dev glslc spirv-headers

      - name: Build
        env:
          # Portable binary: an x86-64-v3 (AVX2) CPU floor instead of
          # -march=native, and no system BLAS, which would add an
          # OpenBLAS/gfortran runtime dependency. The GPU does the heavy work.
          TRANSCRIBE_CMAKE_ARGS: >-
            -DGGML_NATIVE=OFF -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON
            -DGGML_F16C=ON -DGGML_BMI2=ON -DTRANSCRIBE_USE_SYSTEM_BLAS=OFF
        run: |
          rustup toolchain install stable --profile minimal
          cargo build --release --locked

      - name: Package
        run: |
          name=mynah-x86_64-linux
          mkdir "$name"
          cp target/release/mynah dist/mynah.service README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" mynah-*.tar.gz* --generate-notes --verify-tag
