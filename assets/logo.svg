<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="128" height="128">
  <!-- Same bird as src/icon.rs draws for the tray, in a dark pill backdrop. -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#1A1B26"/>
  <g>
    <!-- tail -->
    <polygon points="38,62 4,88 30,84" fill="#E8E9F0"/>
    <!-- body -->
    <ellipse cx="44" cy="61" rx="28" ry="23" fill="#E8E9F0"/>
    <!-- head -->
    <circle cx="60" cy="32" r="20" fill="#E8E9F0"/>
    <!-- beak -->
    <polygon points="76,26 96,34 76,42" fill="#F0A830"/>
    <!-- mynah's yellow eye patch -->
    <ellipse cx="61" cy="26" rx="9" ry="6" fill="#F0A830"/>
    <!-- eye -->
    <circle cx="64" cy="29" r="4.5" fill="#20222C"/>
  </g>
</svg>
